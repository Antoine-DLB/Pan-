<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1d0f0a"/>
      <stop offset="0.35" stop-color="#4a2010"/>
      <stop offset="0.62" stop-color="#8c3f1a"/>
      <stop offset="0.78" stop-color="#c66a28"/>
      <stop offset="0.88" stop-color="#e69440"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a5228"/>
      <stop offset="0.4" stop-color="#5e3417"/>
      <stop offset="1" stop-color="#2b180c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f3e7d3">
    <circle cx="80" cy="80" r="2.4" opacity="0.8"/>
    <circle cx="210" cy="150" r="1.7" opacity="0.6"/>
    <circle cx="330" cy="60" r="2" opacity="0.7"/>
    <circle cx="470" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="600" cy="70" r="2.4" opacity="0.8"/>
    <circle cx="710" cy="170" r="1.7" opacity="0.6"/>
    <circle cx="150" cy="230" r="1.5" opacity="0.45"/>
    <circle cx="650" cy="260" r="1.5" opacity="0.4"/>
    <circle cx="390" cy="200" r="1.3" opacity="0.4"/>
    <circle cx="540" cy="300" r="1.3" opacity="0.3"/>
  </g>

  <!-- banded retro sun -->
  <g>
    <circle cx="400" cy="700" r="150" fill="#f2b04a" opacity="0.16"/>
    <circle cx="400" cy="700" r="118" fill="#f2b04a"/>
    <circle cx="400" cy="700" r="118" fill="#f8c668" opacity="0.45"/>
    <g fill="#c66a28">
      <rect x="270" y="722" width="260" height="9"/>
      <rect x="276" y="748" width="248" height="13"/>
      <rect x="290" y="780" width="220" height="17"/>
    </g>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#241208" stroke-width="4" stroke-linecap="round">
    <path d="M250 420 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M560 380 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- far mesa layer -->
  <g fill="#5a2b14">
    <path d="M0 760 h70 q6 -60 16 -62 h70 q10 2 16 62 h60 v80 H0 z"/>
    <path d="M470 770 h60 q5 -48 13 -50 h56 q8 2 13 50 h120 q5 -40 11 -42 h40 v110 H470 z"/>
  </g>
  <!-- near mesa layer -->
  <g fill="#46210f">
    <path d="M150 820 h80 q7 -70 18 -72 h54 q11 2 18 72 h90 v60 H150 z"/>
    <path d="M620 830 q6 -56 15 -58 h48 q9 2 15 58 h102 v60 H620 z"/>
  </g>

  <!-- dunes -->
  <path d="M0 850 q200 -55 420 -12 q210 38 380 -10 V1200 H0 z" fill="url(#ground)"/>
  <path d="M0 850 q200 -55 420 -12 q210 38 380 -10 l0 14 q-170 46 -380 9 q-218 -42 -420 13 z" fill="#c98a4a" opacity="0.35"/>
  <path d="M0 1000 q240 -62 480 -14 q180 33 320 -12 V1200 H0 z" fill="#241408" opacity="0.55"/>
  <path d="M0 1000 q240 -62 480 -14 q180 33 320 -12 l0 13 q-138 43 -320 11 q-238 -47 -480 14 z" fill="#a06b3d" opacity="0.25"/>

  <!-- big saguaro, left -->
  <g>
    <g fill="#33491f">
      <rect x="84" y="836" width="34" height="194" rx="17"/>
      <rect x="42" y="868" width="26" height="76" rx="13"/>
      <rect x="42" y="922" width="58" height="26" rx="13"/>
      <rect x="128" y="894" width="26" height="62" rx="13"/>
      <rect x="112" y="934" width="42" height="26" rx="13"/>
    </g>
    <g stroke="#243516" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M94 850 V1020"/>
      <path d="M108 850 V1020"/>
      <path d="M54 880 V930"/>
      <path d="M140 906 V944"/>
    </g>
  </g>

  <!-- small saguaro, right -->
  <g fill="#2c3f1c">
    <rect x="664" y="1010" width="24" height="116" rx="12"/>
    <rect x="694" y="1034" width="18" height="48" rx="9"/>
    <rect x="682" y="1062" width="30" height="18" rx="9"/>
    <rect x="640" y="1052" width="18" height="40" rx="9"/>
    <rect x="646" y="1074" width="30" height="18" rx="9"/>
  </g>

  <!-- tumbleweed -->
  <g fill="none" stroke="#7a5530" stroke-width="3" opacity="0.85">
    <circle cx="510" cy="1086" r="26"/>
    <circle cx="510" cy="1086" r="16"/>
    <path d="M492 1068 l36 36 M528 1068 l-36 36 M484 1086 h52 M510 1060 v52"/>
  </g>

  <!-- foreground rocks -->
  <g fill="#1f1107">
    <ellipse cx="250" cy="1168" rx="46" ry="15"/>
    <ellipse cx="296" cy="1176" rx="24" ry="9"/>
    <ellipse cx="120" cy="1190" rx="34" ry="11"/>
  </g>
</svg>
